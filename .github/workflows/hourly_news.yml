name: Hourly Economic News Bot

on:
  schedule:
    # 04:15 to 06:15 WIB (Mon-Fri) -> Sun-Thu 21:15 to 23:15 UTC
    - cron: '15 21-23 * * 0-4'
    # 07:15 to 22:15 WIB (Mon-Fri) -> Mon-Fri 00:15 to 15:15 UTC
    - cron: '15 0-15 * * 1-5'
  workflow_dispatch:     # Allows manual trigger button in GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ponytail: stdlib python script requires 0 pip installs. Execution takes ~5 seconds.
      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          NEWS_URL: ${{ secrets.NEWS_URL }}
        run: python bot.py
